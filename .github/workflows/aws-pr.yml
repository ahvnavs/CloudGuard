name: Optional AWS PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  availability:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      run_aws: ${{ steps.gate.outputs.run_aws }}
    steps:
      - name: Explain optional AWS availability
        id: gate
        env:
          AWS_ENABLED: ${{ vars.CLOUDGUARD_AWS_ENABLED }}
          PLAN_ROLE: ${{ vars.AWS_PLAN_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.AWS_STATE_BUCKET }}
          DEPLOYED_INPUTS: ${{ secrets.CLOUDGUARD_TFVARS_JSON }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          run_aws=false
          configuration_error=false
          if [ "$AWS_ENABLED" != "true" ]; then
            reason='AWS jobs skipped: set CLOUDGUARD_AWS_ENABLED=true after the manual deployment.'
          elif [ "$PR_AUTHOR" != "$GITHUB_REPOSITORY_OWNER" ] || [ "$PR_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            reason='AWS jobs skipped: credentials are restricted to owner-authored PRs within this repository.'
          elif [ -z "$PLAN_ROLE" ] || [ -z "$STATE_BUCKET" ] || [ -z "$DEPLOYED_INPUTS" ]; then
            configuration_error=true
            reason='AWS configuration error: configure AWS_PLAN_ROLE_ARN, AWS_STATE_BUCKET, and CLOUDGUARD_TFVARS_JSON, or disable CLOUDGUARD_AWS_ENABLED.'
          else
            run_aws=true
            reason='AWS jobs enabled: separate candidate plan and deployed-base drift checks will run.'
          fi
          printf 'run_aws=%s\n' "$run_aws" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$reason"
          printf '%s\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
          if [ "$configuration_error" = true ]; then exit 1; fi

  plan:
    needs: availability
    if: needs.availability.outputs.run_aws == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
          mask-aws-account-id: true
      - name: Plan candidate configuration using deployed variables
        env:
          AWS_STATE_BUCKET: ${{ vars.AWS_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
          CLOUDGUARD_TFVARS_JSON: ${{ secrets.CLOUDGUARD_TFVARS_JSON }}
        run: python scripts/terraform_live.py plan

  base-drift:
    needs: availability
    if: needs.availability.outputs.run_aws == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
          mask-aws-account-id: true
      - name: Check deployed base configuration for drift
        env:
          AWS_STATE_BUCKET: ${{ vars.AWS_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
          CLOUDGUARD_TFVARS_JSON: ${{ secrets.CLOUDGUARD_TFVARS_JSON }}
        run: python scripts/terraform_live.py drift
