name: Optional daily drift detection

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 07:30 IST.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  availability:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      run_aws: ${{ steps.gate.outputs.run_aws }}
    steps:
      - name: Explain optional AWS availability
        id: gate
        env:
          AWS_ENABLED: ${{ vars.CLOUDGUARD_AWS_ENABLED }}
          PLAN_ROLE: ${{ vars.AWS_PLAN_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.AWS_STATE_BUCKET }}
          DEPLOYED_INPUTS: ${{ secrets.CLOUDGUARD_TFVARS_JSON }}
        run: |
          run_aws=false
          configuration_error=false
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            reason='Drift skipped: select the deployed main branch.'
          elif [ "$AWS_ENABLED" != "true" ]; then
            reason='Drift skipped: set CLOUDGUARD_AWS_ENABLED=true after the manual deployment.'
          elif [ -z "$PLAN_ROLE" ] || [ -z "$STATE_BUCKET" ] || [ -z "$DEPLOYED_INPUTS" ]; then
            configuration_error=true
            reason='Drift configuration error: configure AWS_PLAN_ROLE_ARN, AWS_STATE_BUCKET, and CLOUDGUARD_TFVARS_JSON, or disable CLOUDGUARD_AWS_ENABLED.'
          else
            run_aws=true
            reason='Drift enabled: checking main against existing deployed state.'
          fi
          printf 'run_aws=%s\n' "$run_aws" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$reason"
          printf '%s\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
          if [ "$configuration_error" = true ]; then exit 1; fi

  drift:
    needs: availability
    if: needs.availability.outputs.run_aws == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
          mask-aws-account-id: true
      - name: Report unchanged, drift, or execution error
        env:
          AWS_STATE_BUCKET: ${{ vars.AWS_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
          CLOUDGUARD_TFVARS_JSON: ${{ secrets.CLOUDGUARD_TFVARS_JSON }}
        run: python scripts/terraform_live.py drift
